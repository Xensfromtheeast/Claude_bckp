# ============================================================
#  Mission Control — week board
#  Converted from the Week Timeline screenshots.
#
#  Every project below is transcribed exactly as shown: same titles,
#  same day spans, same 0% progress. Two fields are NOT from your
#  screenshots and are marked  <-- ESTIMATE  — see the note at the
#  bottom of this file before you trust the capacity tile.
# ============================================================

meta:
  title: Mission Control
  operator: Xens
  # Widened to 04:00 so the Saturday 0400 Recovery block draws truthfully
  # instead of being squashed against the edge of the column.
  day_start: "04:00"
  day_end: "22:00"
  compress: true

# No goal was set in the source board. Uncomment and point it at whatever
# this week is actually for — that switches on the countdown and the
# capacity check. Without it those two tiles stay dark.
#
# goal:
#   label: <what this week is actually for>
#   due: "fri 18:00"
#   detail: <what "done" looks like>

