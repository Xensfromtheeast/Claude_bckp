# ============================================================
#  WHY THE ESTIMATES ARE MARKED
#
#  Your source board tracked SPANS ("Mon → Fri"), not EFFORT.
#  Those are different quantities and only one of them belongs in a
#  capacity calculation.
#
#  "YSK Files Review & Clean, Mon → Fri" does not mean 45 hours of
#  work. It means a window that happens to be open for five days.
#  Summed as booked hours it would read as ~150h against a ~108h
#  week and scream overcommitted for no real reason.
#
#  So each project carries both:
#    start/end  — the window, drawn as a hollow bar on the timeline
#    effort     — the hours it actually costs, used for capacity
#
#  Replace every `effort:` above with your own number. Until you do,
#  the capacity tile is arithmetic on my guesses, not your week.
# ============================================================
